[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ems"]

[project]
name = "ems-analysis"
version = "0.0.1"
description = "Energy Management System Analysis Package: Forecasting and Battery Simulation"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "Nan Ge", email = "18368359+nan2ge1@users.noreply.github.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0.0",
    "matplotlib",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "xgboost>=1.7.0",
    "streamlit>=1.22.0",
    "plotly>=5.14.0",
    "seaborn>=0.12.0",
    "scikit-learn",
    "watchdog",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.urls]
"Homepage" = "https://github.com/nan2ge1/ems-analysis"
